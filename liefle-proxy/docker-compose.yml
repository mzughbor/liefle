services:
  allow-api:
    build:
      context: ./allow-api
    container_name: liefle-allow-api
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      ALLOW_API_SECRET: ${ALLOW_API_SECRET:-dev-secret-change-me}
      DOMAINS_FILE: /data/domains.json
    volumes:
      - allow-api-data:/data
      - ./allow-api/domains.json:/data/domains.json
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: liefle-caddy
    restart: unless-stopped
    depends_on:
      allow-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@liefle.com}
      ALLOW_API_HOST: allow-api
      ALLOW_API_PORT: 8080
      VERCEL_ORIGIN: ${VERCEL_ORIGIN:-https://liefle.vercel.app}
      VPS_IP: ${VPS_IP:-195.35.1.18}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_add:
      - NET_BIND_SERVICE

volumes:
  allow-api-data:
  caddy-data:
  caddy-config:
